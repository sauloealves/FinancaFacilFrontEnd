<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/financa-facil-logo.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finança Fácil</title>
    <script>
      (function () {
        var cookieKey = "financa-facil-theme";
        var match = document.cookie.match(new RegExp("(?:^|; )" + cookieKey + "=([^;]+)"));
        var theme = match ? decodeURIComponent(match[1]) : "light";

        if (theme !== "light" && theme !== "dark") {
          theme = "light";
        }

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
